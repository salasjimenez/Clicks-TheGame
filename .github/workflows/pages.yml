name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      web_manifest_b64: ${{ steps.manifest.outputs.web_manifest_b64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install locked JavaScript dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Show dependency tree
        run: npm ls --all

      - name: Install pinned image optimizer
        run: python -m pip install --disable-pip-version-check --no-deps -r tools/requirements.txt

      - name: Validate game data references
        run: python tools/validate_references.py

      - name: Optimize local raster assets
        run: python tools/optimize_assets.py

      - name: Security guard before build
        run: python tools/security_guard.py --source-only

      - name: TypeScript check
        run: npm run check

      - name: Build from reviewed source
        run: npm run build

      - name: Security guard after build
        run: python tools/security_guard.py

      - name: Save migration smoke test
        run: node scripts/validate-save-migration.mjs

      - name: Bundle metrics
        run: python tools/measure_bundle.py

      - name: Prepare static site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -R assets _site/assets

      - name: Build HTML/JS/CSS integrity manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          cd _site
          find . -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > ../web-manifest.txt
          cd ..
          echo "web_manifest_b64=$(base64 -w0 web-manifest.txt)" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify deployed HTML/JS/CSS matches build artifact
        shell: bash
        env:
          EXPECTED_B64: ${{ needs.build.outputs.web_manifest_b64 }}
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          printf '%s' "$EXPECTED_B64" | base64 -d > /tmp/web-manifest.txt
          failures=0
          while read -r expected relative; do
            clean="${relative#./}"
            actual=""
            for attempt in $(seq 1 12); do
              actual="$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "${BASE_URL%/}/${clean}?sha=${GITHUB_SHA}" | sha256sum | awk '{print $1}')" || true
              if [ "$actual" = "$expected" ]; then
                break
              fi
              sleep 5
            done
            if [ "$actual" != "$expected" ]; then
              echo "MISMATCH $clean expected=$expected actual=$actual"
              failures=$((failures + 1))
            else
              echo "MATCH $clean"
            fi
          done < /tmp/web-manifest.txt
          test "$failures" -eq 0
